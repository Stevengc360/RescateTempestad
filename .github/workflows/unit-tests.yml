name: unit-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate debug keystore (gitignored, per-machine)
        run: >
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey
          -storepass android -keypass android -keyalg RSA -keysize 2048
          -validity 10950 -dname "CN=Android Debug,O=Android,C=US"

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36.1" "build-tools;36.0.0" | tail -n 3

      - name: Run JVM unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon 2>&1 | tee gradle-output.txt

      - name: Publish failure diagnostic as issue
        if: failure()
        run: |
          {
            echo "### Diagnóstico de fallo CI (run ${{ github.run_id }})"
            echo "Últimas 60 líneas de la salida de Gradle:"
            echo '```'
            tail -n 60 gradle-output.txt || echo "(sin salida)"
            echo '```'
          } > body.md
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues \
            -d "$(jq -Rs '{title:"[CI] Fallo de tests en el runner", body:.}' body.md)" > /dev/null
          echo "issue de diagnóstico creado"

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
