name: unit-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate debug keystore (gitignored, per-machine)
        run: >
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey
          -storepass android -keypass android -keyalg RSA -keysize 2048
          -validity 10950 -dname "CN=Android Debug,O=Android,C=US"

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36.1" "build-tools;36.0.0" | tail -n 3

      - name: Run JVM unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon 2>&1 | tee gradle-output.txt

      - name: Write diagnostic file to repo
        if: failure()
        run: |
          set -e
          {
            echo "# Diagnóstico CI run ${{ github.run_id }} sha ${{ github.sha }}"
            echo "## java -version"
            java -version 2>&1
            echo "## gradlew --version"
            ./gradlew --version 2>&1 || true
            echo "## paquetes SDK instalados"
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>/dev/null | tail -n 15 || true
            echo "## últimas 100 líneas de gradle"
            tail -n 100 gradle-output.txt || echo "(sin salida)"
          } > ci-diagnostic.md
          git config user.name "ci-diagnostic"
          git config user.email "44306518+Stevengc360@users.noreply.github.com"
          git add ci-diagnostic.md
          git commit -m "ci: diagnostico del run ${{ github.run_id }} [skip ci]"
          git push
          echo "diagnostico pusheado"

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
