<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body{margin:0;width:1080px;height:1080px;overflow:hidden;background:#080b12;font-family:'Segoe UI',sans-serif}
  .rain{position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 56px,rgba(180,193,202,.10) 56px 57.5px,transparent 57.5px 112px)}
  .flash{position:absolute;inset:0;background:radial-gradient(ellipse 500px 260px at 76% 6%,rgba(160,190,255,.16),transparent 70%)}
  .kick{position:absolute;top:90px;left:0;right:0;text-align:center;color:#f57370;font-weight:800;font-size:30px;letter-spacing:3px}
  h1{position:absolute;top:140px;left:0;right:0;text-align:center;color:#e9c884;font-size:88px;font-weight:800;margin:0;letter-spacing:2px}
  h1 span{color:#e7eae1;display:block;font-size:52px;letter-spacing:12px;font-weight:700}
  .heli{position:absolute;left:70px;top:400px}
  .torn{position:absolute;right:40px;top:340px}
  .pill{position:absolute;bottom:200px;left:50%;transform:translateX(-50%);background:#e9c884;color:#08121a;font-weight:800;font-size:34px;border-radius:60px;padding:20px 56px;white-space:nowrap}
  .foot{position:absolute;bottom:110px;left:0;right:0;text-align:center;color:#8c9da5;font-size:24px;font-weight:600}
</style></head><body>
<div class="rain"></div><div class="flash"></div>
<div class="kick">⚠️ EL TORNADO NO QUIERE QUE LOS SALVES</div>
<h1>RESCATE<span>TEMPESTAD</span></h1>
<svg class="heli" width="440" height="320" viewBox="0 0 420 300">
  <g transform="rotate(-8 210 150)">
    <rect x="120" y="110" width="200" height="110" rx="34" fill="#343d3f" stroke="#e7eae1" stroke-width="5"/>
    <rect x="252" y="128" width="52" height="60" rx="10" fill="#e9c884"/>
    <line x1="120" y1="166" x2="8" y2="118" stroke="#e7eae1" stroke-width="6"/>
    <line x1="210" y1="110" x2="210" y2="66" stroke="#e7eae1" stroke-width="6"/>
    <line x1="70" y1="66" x2="350" y2="66" stroke="#e7eae1" stroke-width="8" stroke-linecap="round"/>
    <line x1="160" y1="218" x2="160" y2="270" stroke="#e7eae1" stroke-width="5"/>
    <line x1="180" y1="270" x2="270" y2="282" stroke="#e9c884" stroke-width="4" stroke-dasharray="14 8"/>
    <circle cx="278" cy="284" r="13" fill="#e9c884"/>
  </g>
</svg>
<svg class="torn" width="320" height="560" viewBox="0 0 320 560">
  <g stroke="#a2aeb4" fill="none" stroke-width="3">
    <ellipse cx="160" cy="50" rx="145" ry="30" opacity=".5"/><ellipse cx="135" cy="115" rx="120" ry="26" opacity=".55"/>
    <ellipse cx="165" cy="185" rx="100" ry="23" opacity=".6"/><ellipse cx="145" cy="255" rx="80" ry="20" opacity=".65"/>
    <ellipse cx="160" cy="320" rx="60" ry="17" opacity=".7"/><ellipse cx="152" cy="380" rx="44" ry="15" opacity=".75"/>
    <ellipse cx="158" cy="435" rx="30" ry="12" opacity=".8"/><ellipse cx="156" cy="485" rx="19" ry="9" opacity=".85"/>
  </g>
</svg>
<div class="pill">GRATIS en Google Play</div>
<div class="foot">Sin anuncios · Sin compras · Sin permisos</div>
</body></html>
