<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#080b12;font-family:'Segoe UI',sans-serif}
  .rain{position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 60px,rgba(180,193,202,.10) 60px 61.5px,transparent 61.5px 120px)}
  .flash{position:absolute;inset:0;background:radial-gradient(ellipse 700px 300px at 75% 6%,rgba(160,190,255,.18),transparent 70%)}
  .top{position:absolute;top:140px;left:60px;right:60px;text-align:center}
  .top .kick{color:#f57370;font-weight:800;font-size:34px;letter-spacing:4px}
  .top h1{color:#e9c884;font-size:96px;margin:10px 0 0;font-weight:800;letter-spacing:2px;line-height:1.05}
  .top h1 span{color:#e7eae1;display:block;font-size:58px;letter-spacing:14px;font-weight:700}
  .top p{color:#8c9da5;font-size:30px;margin:24px 40px 0;font-weight:600}
  .torn{position:absolute;left:50%;transform:translateX(-50%);top:640px}
  .heli{position:absolute;left:calc(50% + 130px);top:760px}
  .store{position:absolute;bottom:230px;left:60px;right:60px;text-align:center}
  .pill{display:inline-block;background:#e9c884;color:#08121a;font-weight:800;font-size:38px;border-radius:60px;padding:22px 64px}
  .foot{position:absolute;bottom:140px;left:0;right:0;text-align:center;color:#8c9da5;font-size:26px;font-weight:600}
</style></head><body>
<div class="rain"></div><div class="flash"></div>
<div class="top">
  <div class="kick">⚠️ EL TORNADO SE LLEVA A TUS RESCATES</div>
  <h1>RESCATE<span>TEMPESTAD</span></h1>
  <p>Pilota el helicóptero · despliega la cuerda · evacúa antes de que llegue el tornado</p>
</div>
<svg class="torn" width="500" height="900" viewBox="0 0 500 900">
  <g stroke="#a2aeb4" fill="none" stroke-width="4">
    <ellipse cx="250" cy="80" rx="230" ry="46" opacity=".5"/><ellipse cx="210" cy="190" rx="190" ry="40" opacity=".55"/>
    <ellipse cx="260" cy="310" rx="160" ry="35" opacity=".6"/><ellipse cx="225" cy="430" rx="125" ry="30" opacity=".65"/>
    <ellipse cx="250" cy="545" rx="95" ry="26" opacity=".7"/><ellipse cx="235" cy="655" rx="70" ry="22" opacity=".75"/>
    <ellipse cx="245" cy="750" rx="48" ry="18" opacity=".8"/><ellipse cx="242" cy="830" rx="30" ry="14" opacity=".85"/>
  </g>
  <text x="250" y="565" text-anchor="middle" font-size="60">🧍</text>
</svg>
<svg class="heli" width="260" height="200" viewBox="0 0 420 300">
  <g transform="rotate(-8 210 150)">
    <rect x="120" y="110" width="200" height="110" rx="34" fill="#343d3f" stroke="#e7eae1" stroke-width="6"/>
    <rect x="252" y="128" width="52" height="60" rx="10" fill="#e9c884"/>
    <line x1="210" y1="110" x2="210" y2="66" stroke="#e7eae1" stroke-width="7"/>
    <line x1="70" y1="66" x2="350" y2="66" stroke="#e7eae1" stroke-width="9" stroke-linecap="round"/>
    <line x1="188" y1="220" x2="180" y2="252" stroke="#e7eae1" stroke-width="6"/>
    <line x1="252" y1="220" x2="260" y2="252" stroke="#e7eae1" stroke-width="6"/>
    <line x1="150" y1="256" x2="292" y2="256" stroke="#e7eae1" stroke-width="6"/>
    <line x1="160" y1="256" x2="160" y2="290" stroke="#e9c884" stroke-width="5" stroke-dasharray="16 9"/>
    <circle cx="160" cy="296" r="14" fill="#e9c884"/>
  </g>
</svg>
<div class="store"><div class="pill">GRATIS en Google Play</div></div>
<div class="foot">Sin anuncios · Sin compras · Sin permisos</div>
</body></html>
